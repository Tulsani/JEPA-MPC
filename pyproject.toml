[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-mpc"
version = "0.1.0"
description = "Adaptive-horizon planning with action-conditioned JEPA world models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
pusht = ["zarr>=2.16,<3"]
dev = ["pytest>=7.4"]
# UltraViolet runs: LeWM checkpoints, HDF5 data, stable-worldmodel evaluation.
cluster = [
    "stable-worldmodel[train,env]==0.1.1",
    # LeWM checkpoints use pre-5.0 ViT parameter names.
    "transformers>=4.50,<5",
    "h5py>=3.9",
    "hdf5plugin>=4.1",
    "zstandard>=0.22",
    "huggingface_hub>=0.23",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["jepa_mpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
